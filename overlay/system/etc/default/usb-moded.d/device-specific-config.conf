# OnePlus 8: idVendor 0x2A70 is set by the stock init.qcom.usb.rc; the MTP/ADB
# product ids are the AOSP defaults the stock configfs rc uses, RNDIS ids are OnePlus'.
IDVENDOR=2A70
IDPRODUCT_MTP=4EE1
IDPRODUCT_MTP_ADB=4EE2
IDPRODUCT_RNDIS=F00E
IDPRODUCT_RNDIS_ADB=9024
# Disable usb-moded's rescue mode.
USB_MODED_ARGS=
MANUFACTURER=OnePlus
PRODUCT=OnePlus 8
