# OnePlus 8: the Bluetooth HAL runs as init service "vendor.bluetooth-1-0-qti" and a second
# bluetooth-named service (vendor.bluetooth_dun-1-0) exists. The stock bluebinder_wait.sh collects
# the state of every init.svc.*bluetooth* property and compares the result to a single "[running]",
# which can never match with two running services. Wait for the HAL's own property instead.
[Unit]
# The shipped unit puts these in [Service], where systemd ignores them with a warning.
StartLimitIntervalSec=20
StartLimitBurst=10

[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'for i in $(seq 1 55); do [ "$(/usr/bin/getprop init.svc.vendor.bluetooth-1-0-qti 2>/dev/null)" = running ] && { echo "Bluetooth HAL running"; exit 0; }; echo "Waiting for vendor.bluetooth-1-0-qti"; sleep 1; done; exit 1'
