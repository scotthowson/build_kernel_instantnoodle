instantnoodle:
  Vendor: OnePlus
  codename: instantnoodle
  Names:
    - OnePlus8
    - OnePlus 8
    - instantnoodle
  PrettyName: OnePlus 8
  DeviceType: phone
  GridUnit: 21
  WebkitDpr: 2
  SupportedOrientations:
    - Portrait
    - Landscape
    - InvertedLandscape
  BacklightSysfsPath:
    - /sys/class/backlight/panel0-backlight
  FlashlightSysfsPath:
    - /sys/class/leds/led:torch_0/brightness
  FlashlightSwitchPath:
    - /sys/class/leds/led:switch_0/brightness
  MirAndroidPlatformServerBackpressure:
    - false
  MirAndroidPlatformServerPartialUpdates:
    - true
  MirAndroidPlatformServerEglSync:
    - false
  MirAndroidPlatformClientEglFlush:
    - all
  XwaylandShm:
    - true
  OfonoPlugin: binder
  OfonoImplementsIms: true
  FilesystemEncryption: true
  # Punch-hole camera, top left: 68 px circle at x 65-133, y 34-103 on the 1080x2376 panel (from the
  # OnePlus 8 framework overlay). A 104 px panel keeps app content below the hole. Horizontal
  # DisplayCutouts are deliberately not set: Lomiri pushes any indicator overlapping a cutout to the
  # far side of it, and the 65 px strip left of the hole cannot hold one, so the notifications
  # indicator (leftmost) ended up off-screen. Without cutouts its icon sits left of the hole.
  CollapsedPanelHeight: 104
