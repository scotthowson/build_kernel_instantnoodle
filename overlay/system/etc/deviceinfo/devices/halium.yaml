instantnoodle:
  Vendor: OnePlus
  codename: instantnoodle
  Names:
    - OnePlus8
    - OnePlus 8
    - instantnoodle
  PrettyName: OnePlus 8
  DeviceType: phone
  GridUnit: 21
  WebkitDpr: 2
  SupportedOrientations:
    - Portrait
    - Landscape
    - InvertedLandscape
  BacklightSysfsPath:
    - /sys/class/backlight/panel0-backlight
  FlashlightSysfsPath:
    - /sys/class/leds/led:torch_0/brightness
  FlashlightSwitchPath:
    - /sys/class/leds/led:switch_0/brightness
  MirAndroidPlatformServerBackpressure:
    - false
  MirAndroidPlatformServerPartialUpdates:
    - true
  MirAndroidPlatformServerEglSync:
    - false
  MirAndroidPlatformClientEglFlush:
    - all
  XwaylandShm:
    - true
  OfonoPlugin: binder
  OfonoImplementsIms: true
  FilesystemEncryption: true
  # Punch-hole camera, top left: Android's framework overlay gives a 68 px circle at x 65-133,
  # y 34-103 on the 1080x2376 panel; on the device the visible hole is slightly larger, so the
  # rectangles below are 76 px wide (x 61-137). Rectangles are "x y width height" in pixels.
  # Trade-off: Lomiri pushes an indicator that overlaps a cutout to the far side of it, and the
  # 61 px left of the hole cannot hold a whole indicator, so the leftmost one (notifications)
  # can end up partly off-screen when many indicators are shown.
  CollapsedPanelHeight: 104
  DisplayCutoutsCollapsed:
    - 61 0 76 104
  DisplayCutoutsCollapsedLight:
    - 61 0 76 104
  DisplayCutoutsExpanded:
    - 61 0 76 112
