# Builds the OnePlus 8 (instantnoodle) Ubuntu Touch port on your self-hosted runner.
#
# Requirements on the runner machine:
#   - a GitHub Actions self-hosted runner registered to this repository with the label "self-hosted"
#   - Docker (the job runs inside an ubuntu:22.04 container, like the UBports GitLab CI does)
#
# Every run produces boot.img, recovery.img, dtbo.img, the device tarball and a compressed
# ubuntu.img (rootfs), uploads them as an artifact and publishes them as a pre-release named
# test-<run number>. A tag push (v*) publishes a full release instead.
name: Build Ubuntu Touch images

on:
  push:
    branches: [android-10-testing]
    tags: ['v*']
    paths-ignore: ['**.md', '.vscode/**']
  pull_request:
    branches: [android-10-testing]
  workflow_dispatch:
    inputs:
      flashable:
        description: "Build the rootfs (ubuntu.img) from the latest 24.04 OTA"
        type: boolean
        default: true
      build_tools_branch:
        description: "halium-generic-adaptation-build-tools branch"
        type: string
        default: main
      release:
        description: "Publish the images as a release (pre-release unless a v* tag was pushed)"
        type: boolean
        default: true
      kernel_branch:
        description: "Kernel branch to build instead of the one in deviceinfo (e.g. Halium-10-Test)"
        type: string
        default: ""
      release_name:
        description: "Release title (blank = Test build <run number>)"
        type: string
        default: ""
      release_tag:
        description: "Release tag (blank = test-<run number>; must be a valid git tag name)"
        type: string
        default: ""

env:
  TOOLS_BRANCH: ${{ inputs.build_tools_branch || 'main' }}
  DEBIAN_FRONTEND: noninteractive
  # the rootfs is built on every run; a manual run can untick "flashable" to skip it
  FLASHABLE: ${{ github.event_name != 'workflow_dispatch' || inputs.flashable }}

permissions:
  contents: write

jobs:
  build:
    name: Kernel, boot, recovery, device tarball
    runs-on: [self-hosted]
    env:
      # Release naming in one place. A pushed v* tag always wins; a manual run may set a
      # title and tag; otherwise test-<run number> / Test build <run number>.
      REL_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('test-{0}', github.run_number)) }}
      REL_TITLE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_name != '' && inputs.release_name || format('Test build {0}', github.run_number)) }}
    container:
      image: ubuntu:22.04
      # losetup/mount inside system-image-from-ota.sh need a privileged container
      # /srv/ut-build-cache on the runner host persists toolchain downloads between runs (optional)
      options: --privileged -v /srv/ut-build-cache:/cache
    timeout-minutes: 240
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl fakeroot flex git kmod \
            libelf-dev libssl-dev libtinfo5 lz4 python2 python3 sudo unzip wget xz-utils \
            pahole libbpf-dev img2simg jq zstd rsync
          ln -sf python2 /usr/bin/python

      - name: Checkout
        uses: actions/checkout@v4

      - name: Override kernel branch
        if: inputs.kernel_branch != ''
        run: |
          sed -i 's|^deviceinfo_kernel_source_branch=.*|deviceinfo_kernel_source_branch="${{ inputs.kernel_branch }}"|' deviceinfo
          grep deviceinfo_kernel_source_branch deviceinfo

      - name: Clone build tools
        run: git clone -b "$TOOLS_BRANCH" https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git build

      - name: Prepare download cache and pre-fetch tooling
        # /cache is a host directory mounted via the container options (see RUNNER.md). Toolchains
        # and tooling are kept there across runs; the kernel source and objects are always fresh.
        # android.googlesource.com answers 503 / drops connections now and then, so clone with retries.
        run: |
          mkdir -p workdir
          if [ -d /cache ] && [ -w /cache ]; then
            mkdir -p /cache/downloads
            rm -rf /cache/downloads/KERNEL_OBJ
            ln -sfn /cache/downloads workdir/downloads
            echo "Using persistent download cache at /cache/downloads"
          else
            mkdir -p workdir/downloads
            echo "No /cache mount, downloads are not persisted"
          fi
          fetch() { # url branch dir
            [ -d "workdir/downloads/$3" ] && { echo "$3 already present"; return 0; }
            for i in 1 2 3 4 5 6; do
              git clone --depth 1 --recursive -b "$2" "$1" "workdir/downloads/$3" && return 0
              echo "clone of $3 failed (attempt $i), retrying in 30s"
              rm -rf "workdir/downloads/$3"; sleep 30
            done
            return 1
          }
          fetch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 android10-gsi linux-x86
          fetch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 pie-gsi aarch64-linux-android-4.9
          fetch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 pie-gsi arm-linux-androideabi-4.9
          fetch https://android.googlesource.com/platform/external/avb android13-gsi avb

          # Kernel: clone it here with retries too (the build tools would otherwise clone it without any).
          # WireGuard is vendored in the kernel tree (net/wireguard), nothing else needs seeding.
          source ./deviceinfo
          KDIR="$(basename "${deviceinfo_kernel_source%.git}")"
          rm -rf "workdir/downloads/$KDIR"
          fetch "$deviceinfo_kernel_source" "$deviceinfo_kernel_source_branch" "$KDIR"
          du -sh workdir/downloads/* 2>/dev/null || true

      - name: Build
        run: ./build/build.sh

      - name: Extract partition images from the device tarball
        # The build tools only leave the device tarball in out/; boot/recovery/dtbo live inside it
        # under partitions/. The rootfs step also extracts them, but it does not run on every trigger.
        run: |
          for img in boot recovery dtbo; do
            [ -f out/$img.img ] || tar -C out --strip-components=1 -xf out/device_instantnoodle.tar.xz partitions/$img.img
          done
          ls -l out

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instantnoodle-boot-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/boot.img
            out/recovery.img
            out/dtbo.img
            out/device_instantnoodle.tar.xz

      - name: Build flashable rootfs (ubuntu.img)
        if: env.FLASHABLE == 'true'
        run: |
          ./build/prepare-fake-ota.sh out/device_instantnoodle.tar.xz ota
          ./build/system-image-from-ota.sh ota/ubuntu_command out
          mv out/rootfs.img out/ubuntu.img
          zstd --ultra -22 -T0 --rm out/ubuntu.img

      - name: Upload rootfs artifact
        if: env.FLASHABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instantnoodle-rootfs-${{ github.sha }}
          if-no-files-found: error
          path: out/ubuntu.img.zst

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_TITLE }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Ubuntu Touch 24.04 (Halium 10) images for OnePlus 8 (instantnoodle), built from ${{ github.sha }}.

            Install guide: docs/INSTALL.md. Update of an existing install (slot A):
            ```
            fastboot flash boot_a boot.img            # bootloader
            fastboot flash dtbo_a dtbo.img
            fastboot flash recovery_a recovery.img
            fastboot reboot fastboot
            zstd -d ubuntu.img.zst && fastboot flash system_a ubuntu.img   # fastbootd
            ```
          files: |
            out/boot.img
            out/recovery.img
            out/dtbo.img
            out/device_instantnoodle.tar.xz
            out/ubuntu.img.zst
