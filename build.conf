# build.conf — settings consumed by ./build.sh

# Generic adaptation build tools (cloned into ./build)
BUILD_TOOLS_REPO=https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git
BUILD_TOOLS_BRANCH=main

# The overlay now lives in this repository (./overlay). Leave OVERLAY_REPO empty to use it.
# Set both values to pull an external overlay repository instead (it replaces ./overlay).
OVERLAY_REPO=
OVERLAY_BRANCH=

# Third-party recovery images fetched by tools/download-recovery-images.sh
# format: "path|url"
RECOVERY_IMAGES=(
    "Images/recovery/ofox.img|https://github.com/Wishmasterflo/android_device_oneplus_kebab/releases/download/V15/OrangeFox-R11.1-Unofficial-OnePlus8T_9R-V15.img"
    "Images/recovery/twrp.img|https://github.com/scotthowson/twrp_device_oneplus_instantnoodle/releases/download/v1.0.12/twrp-howsondev-v1.0.12.img"
    "Images/recovery/los.img|https://github.com/IllSaft/los18.1-recovery/releases/download/0.1/LineageOS-18.1-Recovery.img"
)
